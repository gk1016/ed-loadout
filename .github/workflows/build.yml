# cargo test on every push and PR, on the repo's WSL runner (x2-<repo>-wsl,
# shared CI HOME, CARGO_HOME/RUSTUP_HOME = gk1016's toolchain). No release.
# Repo variables (set by bts-repo-init):
#   BTS_RUNNER_WSL       runner labels, JSON list (default below)
#   BTS_CARGO_MANIFEST   Cargo.toml path, repo-relative (default Cargo.toml)
# From gk1016/bts-template stacks/rust-only (frago plan 2026-11-14-pipeline-v2 C4).
name: build

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(vars.BTS_RUNNER_WSL || '["self-hosted","linux","wsl","evo-x2"]') }}
    timeout-minutes: 45
    # Explicit: the repo default is read+write (bts-repo-init), and this job
    # runs the pushed code.
    permissions:
      contents: read
    env:
      MANIFEST: ${{ vars.BTS_CARGO_MANIFEST || 'Cargo.toml' }}
    steps:
      - uses: actions/checkout@v4

      - name: cargo test
        run: |
          set -euo pipefail
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          cargo --version
          cargo test --manifest-path "$MANIFEST" 2>&1 | tee cargo-test.log

      - name: cargo-test.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-log
          path: cargo-test.log
          if-no-files-found: warn
