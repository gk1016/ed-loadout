# Release lane for ed-loadout: build the Windows (.exe, cross-compiled with the
# runner's mingw-w64 + x86_64-pc-windows-gnu target) and Linux binaries and
# attach them to a GitHub Release. Runs on a v* tag or by hand. Written by
# Cowork 2026-11-21 (plan claude/plans/2026-11-21-loadout-v0.1.md). Nothing
# here touches a user's machine; LOADOUT has no server side.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ fromJSON(vars.BTS_RUNNER_WSL || '["self-hosted","linux","wsl","evo-x2"]') }}
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: build
        run: |
          set -euo pipefail
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          cargo --version
          cargo test
          cargo build --release --target x86_64-pc-windows-gnu
          cargo build --release
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/ed-loadout.exe dist/ed-loadout-${TAG}-windows-x86_64.exe
          cp target/release/ed-loadout dist/ed-loadout-${TAG}-linux-x86_64
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          file dist/*.exe

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "LOADOUT $TAG" --notes "Windows and Linux builds of ed-loadout $TAG. See README for the two-machine walkthrough."
          fi
