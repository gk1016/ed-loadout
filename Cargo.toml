[package]
name = "ed-loadout"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
sha2 = "0.10"
similar = "2"
toml = "0.8"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
