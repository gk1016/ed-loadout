[package]
name = "loadout-core"
version = "0.3.0"
edition = "2024"

# staticlib so MSVC links it straight into the Qt executable (loadout.exe);
# rlib so the CLI (src/bin/ed-loadout.rs) and the tests use the same library.
# Same shape as frago-core.
[lib]
name = "loadout_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ed-loadout"
path = "src/bin/ed-loadout.rs"

[dependencies]
cxx = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
roxmltree = "0.20"
sha2 = "0.10"
similar = "2"
toml = "0.8"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
